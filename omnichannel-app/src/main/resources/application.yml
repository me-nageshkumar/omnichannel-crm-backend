server:
  port: 8080

spring:
  mvc:
    async:
      # CSV exports stream under the async timeout; the default (~30 s) cuts off big downloads to slow clients.
      request-timeout: 15m
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 17MB
  mongodb:
    uri: ${OMNICHANNEL_MONGODB_URI:mongodb://localhost:27017/omnichannel_crm}
  data:
    mongodb:
      auto-index-creation: true

logging:
  level:
    me.nageshk.omnichannel: INFO

omnichannel:
  # Cloud interactive messages sent over the bridge are a link to a page here: the public HTTPS origin WhatsApp
  # fetches the preview from. For a local check run a tunnel and point this at it.
  pages:
    base-url: ${OMNICHANNEL_PAGES_BASE_URL:http://localhost:8080}
    ttl-days: 90
    reply-window: 48h
  webhooks:
    retention: 30d
    keep-raw: true
    raw-max-bytes: 65536
  jwt:
    # Must be at least 32 bytes. Override in production: OMNICHANNEL_JWT_SECRET=...
    secret: ${OMNICHANNEL_JWT_SECRET:dev-only-secret-please-change-me-0123456789}
    ttl: 12h
  # Seeded on first start when no SUPER_ADMIN exists. Password is a bcrypt hash:
  #   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n'
  super-admin:
    name: ${OMNICHANNEL_SUPER_ADMIN_NAME:Nagesh Kumar}
    username: ${OMNICHANNEL_SUPER_ADMIN_USERNAME:nageshk}
    password: ${OMNICHANNEL_SUPER_ADMIN_PASSWORD:}
    email: ${OMNICHANNEL_SUPER_ADMIN_EMAIL:}
    mobile-number: ${OMNICHANNEL_SUPER_ADMIN_MOBILE:}
  two-factor:
    issuer: Omnichannel CRM
  # Demo customer, brands, people and the number 919928088743. Off unless set to true.
  seed:
    demo: ${OMNICHANNEL_SEED_DEMO:false}
  ws:
    allowed-origins: "chrome-extension://*"
  rpc:
    timeout: 30s
    auth-timeout: 5s
  history:
    auto-tick: true
    tick: 5s
    page-size: 100
    max-loads: 20
    page-delay: 400ms
    chat-delay: 1s
    max-messages-per-chat: 5000
    max-empty-pages: 3
    max-idle-pages: 25
    time-budget: 60s
    max-timeouts-per-chat: 3
    # a chat a fetch creates opens and is routed when the contact wrote within this window and it waits on us
    waiting-window: 7d
    # after a page, our delivered/read/played messages get their times from WhatsApp's receipts (ids per page call)
    receipts: true
    receipts-batch: 25
  automation:
    auto-tick: true
    tick: 2s
    lease: 5m
    max-attempts: 3
    batch: 20
    test-idle: 30m
    send-timeout: 60s
    retry-delay: 2m
  # chatbot runs: a small pool walks flows off the request threads; a ticker answers timers and ends idle runs
  chatbot:
    auto-tick: true
    tick: 2s
    lease: 2m
    pool-size: 4
    max-steps: 200
    max-jumps: 5
    http-timeout: 10s
    http-max-body: 1048576
    send-timeout: 60s
    send-attempts: 3
    send-retry-delay: 30s
    versions-kept: 50
    allow-private-http: false
  contacts:
    # a stored inbound message looks up its contact's other WhatsApp id (tests switch it off)
    resolve-on-message: true
    # a contact missing its phone or its hidden id is looked up on its number's device at most once per retry, and a
    # device is asked at most once per pace
    resolve-retry: 1h
    resolve-pace: 300ms
    # at most this many contacts are queued by one "Resolve hidden numbers" request (those without a phone first)
    resolve-batch: 500
