de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.12
# the tests call localhost; a server on every address can share its port with a program on 127.0.0.1 alone, which
# then answers instead (TestServerAddressIT)
server:
  address: 127.0.0.1
omnichannel:
  super-admin:
    password: ""
  pages:
    base-url: http://pages.test
  # tests drive CampaignRunner.tick() themselves
  campaign:
    auto-tick: false
  # tests drive the history import tick themselves, without waits between pages
  history:
    auto-tick: false
    page-delay: 0ms
    chat-delay: 0ms
  # tests drive the automation worker themselves
  automation:
    auto-tick: false
  # tests drive the chatbot ticker themselves; local servers are allowed for the HTTP node tests
  chatbot:
    auto-tick: false
    allow-private-http: true
  # a stored message does not look up its contact's other id on the device (ContactIdResolverIT switches it on),
  # so other tests' fake devices see only the requests they expect; the pace is short
  contacts:
    resolve-on-message: false
    resolve-pace: 50ms
  crm:
    jobs:
      # tests run the CRM jobs themselves
      enabled: false
logging:
  level:
    de.flapdoodle: WARN
