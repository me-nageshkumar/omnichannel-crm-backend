de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.12
# the tests call localhost; a server on every address can share its port with a program on 127.0.0.1 alone, which
# then answers instead (TestServerAddressIT)
server:
  address: 127.0.0.1
omnichannel:
  super-admin:
    password: ""
  # tests drive CampaignRunner.tick() themselves
  campaign:
    auto-tick: false
  # tests drive the history import tick themselves, without waits between pages
  history:
    auto-tick: false
    page-delay: 0ms
    chat-delay: 0ms
  # tests drive the automation worker themselves
  automation:
    auto-tick: false
  crm:
    jobs:
      # tests run the CRM jobs themselves
      enabled: false
logging:
  level:
    de.flapdoodle: WARN
